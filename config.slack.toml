[slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"
allow_all_channels = true
allowed_channels = []
allow_all_users = true
allowed_users = ["U0AN2L7FQLE"]
allow_bot_messages = "mentions"
trusted_bot_ids = []
allow_user_messages = "multibot-mentions"
max_bot_turns = 100

[agent]
# Local patched fork of codex-acp with mid-turn steering (bonginkan/codex-acp).
command = "/Users/thepioneer/Documents/GitHub/codex-acp/target/release/codex-acp"
args = [
  "-c", "model=\"gpt-5.5\"",
  "-c", "model_reasoning_effort=\"xhigh\"",
  "-c", "approval_policy=\"never\"",
  "-c", "sandbox_mode=\"danger-full-access\"",
  "-c", "features.fast_mode=true",
  # Store MCP OAuth tokens in CODEX_HOME/.credentials.json instead of the macOS
  # keychain: the locally rebuilt codex-acp binary is never in the keychain
  # item's ACL, so every access raises a SecurityAgent password dialog that
  # nobody can answer on an unattended bridge (turns then time out).
  "-c", "mcp_oauth_credentials_store=\"file\"",
]
working_dir = "/Users/thepioneer/Documents/GitHub"

[attachments]
enabled = true
allowed_dirs = [
  "/Users/thepioneer/Documents/GitHub",
  "/Users/thepioneer/.codex/generated_images",
]
max_files = 10

[pool]
max_sessions = 10
session_ttl_hours = 24
liveness_check_secs = 30

[markdown]
tables = "code"

[reactions]
enabled = true
remove_after_reply = false
tool_display = "compact"

[reactions.timing]
debounce_ms = 700
stall_soft_ms = 10000
stall_hard_ms = 30000
done_hold_ms = 1500
error_hold_ms = 2500
