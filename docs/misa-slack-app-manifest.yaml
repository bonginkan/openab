_metadata:
  major_version: 1
display_information:
  name: MISA
  description: OpenAB-backed coding agent for bonginkan.slack.com
features:
  bot_user:
    display_name: MISA
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - reactions:write
      - files:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: true
  is_hosted: false
  token_rotation_enabled: false
